# See pipeline/themes.py for how these fields are consumed. No scoring code changes.
theme:
  id: grid_electrification
  display_name: "Grid & Electrification Buildout"
  version: 1
  status: active
  created: 2026-08-17
  thesis: >
    Load growth from electrification, reshored manufacturing and data centers is arriving on a
    transmission and distribution system planned around two decades of flat demand. The money
    moves in a fixed order - transformers, switchgear, conductor and substation work are
    ordered years before the generation they connect - so the exposure worth identifying sits
    with the equipment makers and the contractors doing the interconnection work, not with the
    utility whose rate base grows at the end of it.

  # Anchors for peer expansion and a sanity check on the keyword list, not the universe.
  seed_tickers: [ETN, PWR, HUBB, EMR, PNR, AME, ROK, ACM]
  expand_via_tnic: true
  # Where this supply chain can physically sit. A filing-language screen with no scope ranks
  # any company that happens to describe its own data centers; a grid buildout is built by
  # industrials and equipment makers and paid for by utilities.
  sectors: [Industrials, Utilities, Technology, Basic Materials]
  keywords:
    include:
      - "transformer"
      - "switchgear"
      - "substation"
      - "transmission and distribution"
      - "interconnection queue"
      - "grid hardening"
      - "electrical infrastructure"
      - "medium voltage"
      - "load growth"
      - "HVDC"
    exclude:
      # "Transformer" is also the dominant neural-network architecture, so a software filer
      # would otherwise score as a maker of electrical equipment. The rest is decarbonization
      # marketing language, which every large filer now carries regardless of what it sells.
      - "transformer architecture"
      - "transformer model"
      - "clean energy transition"
      - "sustainability goals"
      - "net-zero commitment"
  sic_codes: [3612, 3613, 1731]   # power/distribution equipment, electrical work
  icb_subsectors: []

  signals:
    - name: filing_keyword_density_trend
      source: edgar_fulltext
      leading: true
      weight: 0.35
    - name: backlog_growth              # orders booked, the earliest honest read on a buildout
      source: edgar_xbrl_dimensional
      leading: true
      weight: 0.20
    - name: segment_revenue_share
      source: edgar_xbrl_segments
      leading: false
      weight: 0.20
    - name: spender_capex_growth        # regulated utility capex is what funds this theme
      source: edgar_xbrl_capex
      universe: [NEE, DUK, SO, AEP, XEL, SRE, EIX, WEC, ED]
      leading: true
      weight: 0.15
    - name: customer_concentration_to_spenders
      source: edgar_item1_major_customers
      leading: true
      weight: 0.10

  guardrails:
    exclude_if_valuation_percentile_above: 90
    require_leading_signal_confirmation: true
    max_price_momentum_contribution: 0.0

  scoring:
    output: theme_exposure_score
    min_signals_required: 2
