# See pipeline/themes.py for how these fields are consumed. No scoring code changes.
theme:
  id: digital_payments
  display_name: "Digital Payments & Financial Infrastructure"
  taxonomy_tag: FINTECH_AND_DIGITAL_PAYMENTS
  version: 1
  status: active
  created: 2026-08-17
  thesis: >
    Cash displacement is a decades-long substitution that compounds quietly: every transaction
    that moves onto a card or an account-to-account rail becomes a metered event for the
    network carrying it. The economics belong to the toll collectors rather than the banks,
    which is why this theme is scoped to networks, processors and software rather than to
    lenders whose earnings turn on credit and rates.

  chain:
    root_driver: >
      Cash and cheque volume keeps converting to electronic payment, and commerce, payroll and
      billing increasingly embed a payment step inside software rather than beside it.
    first_order: >
      The networks and processors that clear the transaction and price it per event.
    second_order: >
      Fraud, identity and risk systems that make the rails usable at scale; the core banking
      and issuer-processing software beneath them; and the terminal and hardware makers at the
      point of sale.
    disconfirming: >
      Payment volume growth converging on nominal consumption growth, which means the
      substitution is finished; take rates compressing under regulatory caps or account-to-
      account rails that bypass the networks; consumer credit deteriorating enough to shrink
      transaction volume itself.

  # US-listed only, matching the universe this pipeline scores; a foreign-listed anchor would
  # never resolve a peer group or a filing here.
  seed_tickers: [V, MA, FIS, GPN, JKHY, PYPL, TOST]
  expand_via_tnic: true
  sectors: [Technology, Financial Services, Industrials]
  industries:
    - "credit services"                  # the card networks
    - "information technology services"  # merchant acquirers and processors
    - "software - infrastructure"
    - "software - application"           # core banking, issuer processing
    - "specialty business services"
  keywords:
    include:
      - "payment volume"
      - "merchant acquiring"
      - "interchange"
      - "issuer processing"
      - "real-time payments"
      - "tokenization"
      - "embedded finance"
      - "point of sale"
      - "cross-border payment"
      - "fraud prevention"
    exclude:
      # Lending and treasury language: a bank describing its own funding is not a payments
      # business, and this theme is deliberately not a bank theme.
      - "net interest margin"
      - "loan loss provision"
      - "deposit growth"
      - "our payment obligations"
  sic_codes: [7389, 6099, 7372]
  icb_subsectors: []

  roles:
    root:
      industries: ["credit services"]
    enabler:
      industries: ["information technology services", "software - infrastructure"]
    supplier:
      industries: ["software - application"]
    service:
      industries: ["specialty business services"]

  signals:
    - name: filing_keyword_density_trend
      source: edgar_fulltext
      leading: true
      weight: 0.10
    - name: segment_revenue_share
      source: edgar_xbrl_segments
      leading: false
      weight: 0.45
    - name: backlog_growth
      source: edgar_xbrl_dimensional
      leading: true
      weight: 0.20
    # The platforms whose commerce volume is the demand these rails carry.
    - name: spender_capex_growth
      source: edgar_xbrl_capex
      universe: [AMZN, SHOP, JPM, BAC, WMT]
      leading: true
      weight: 0.20

  guardrails:
    exclude_if_valuation_percentile_above: 90
    require_leading_signal_confirmation: true
    max_price_momentum_contribution: 0.0

  scoring:
    output: theme_exposure_score
    min_signals_required: 2
