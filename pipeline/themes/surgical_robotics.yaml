# See pipeline/themes.py for how these fields are consumed. No scoring code changes.
theme:
  id: surgical_robotics
  display_name: "Surgical & Medical Robotics"
  taxonomy_tag: SURGICAL_AND_MEDICAL_ROBOTICS
  root_driver_tag: AGING_LABOR_SCARCITY
  version: 1
  status: active
  created: 2026-08-29

  chain:
    root_driver: >
      An aging population needing more surgical procedure volume is arriving at the same time as
      a persistent shortage of trained surgeons and operating-room staff, and robotic-assisted
      systems substitute capital for that scarce clinical labor rather than merely improving an
      outcome that unconstrained staffing could already deliver.
    first_order: >
      Surgical-robotics platform makers, whose installed base and procedure-volume growth is the
      direct evidence of clinician-labor substitution.
    second_order: >
      Adjacent medical-device makers building robotic and navigation platforms into orthopedic
      and other procedure lines, and the hospital systems whose capital budgets fund adoption.
    disconfirming: >
      Procedure-volume growth slowing at the largest installed base; hospital capital budgets for
      new system placements cut; competing platforms taking share on price rather than the
      installed base continuing to expand the total addressable procedure count.
  roles:
    root:
      industries: ["medical instruments & supplies", "medical devices"]
      tickers: [ISRG]
    supplier:
      industries: ["medical instruments & supplies", "diagnostics & research"]
      tickers: [MDT, SYK]
  thesis: >
    This is the aging-demographics theme's labor-substitution edge made specific: a robotic
    surgical system is capital replacing scarce clinician time, not merely capital-intensive
    care, which is why this theme is kept distinct from the broader aging_demographics screen -
    the roles overlap by root driver, not by what actually distinguishes the evidence for each.

  seed_tickers: [ISRG, MDT, SYK]
  expand_via_tnic: true
  sectors: [Healthcare]
  industries:
    - "medical instruments & supplies"
    - "medical devices"
    - "diagnostics & research"
  keywords:
    include:
      - "robotic-assisted surgery"
      - "surgical robot"
      - "installed base"
      - "procedure volume"
      - "minimally invasive"
      - "clinician shortage"
      - "surgical training"
    exclude:
      # Industrial and software-automation language that happens to share the word "robot".
      - "process automation"
      - "software robot"
      - "warehouse robot"
  sic_codes: [3841, 3845]
  icb_subsectors: []

  signals:
    - name: filing_keyword_density_trend
      source: edgar_fulltext
      leading: true
      weight: 0.10
    - name: segment_revenue_share
      source: edgar_xbrl_segments
      leading: false
      weight: 0.35
    - name: backlog_growth
      source: edgar_xbrl_dimensional
      leading: true
      weight: 0.15
    # Hospital-system capital spending is the demand this theme's system placements draw on.
    - name: spender_capex_growth
      source: edgar_xbrl_capex
      universe: [HCA, UHS]
      leading: true
      weight: 0.25
    - name: customer_concentration_to_spenders
      source: edgar_item1_major_customers
      leading: true
      weight: 0.15

  guardrails:
    exclude_if_valuation_percentile_above: 90
    require_leading_signal_confirmation: true
    max_price_momentum_contribution: 0.0

  scoring:
    output: theme_exposure_score
    min_signals_required: 2
