  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Explainable company research across valuation, quality, financial health, growth, market behavior, and news sentiment. Every score shows the evidence and the coverage behind it." />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow" />

    <!-- Share previews. og:url and og:image want absolute URLs; they are root-relative
         here because the deploy domain is not committed to this repo. See TODO.md. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ValueSignal" />
    <meta property="og:title" content="ValueSignal — Fundamentals-first investment research" />
    <meta property="og:description" content="Explainable company research across valuation, quality, financial health, growth, market behavior, and news sentiment." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:image:alt" content="ValueSignal" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ValueSignal — Fundamentals-first investment research" />
    <meta name="twitter:description" content="Explainable company research across valuation, quality, financial health, growth, market behavior, and news sentiment." />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- iPhone home-screen app behavior: full-screen standalone launch, matching status bar, real icon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0e14" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ValueSignal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/font.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      (() => {
        // Keep in sync with MEDIUM_META in src/mediums/registry.js — duplicated here
        // (rather than imported) so the medium is set before first paint, synchronously,
        // with no module-load round trip. [colorScheme, themeColor] per medium id.
        const MEDIUM_PAINT = {
          gallery: ['light', '#f2ede2'], cockpit: ['dark', '#0a0d10'], neon: ['dark', '#0d0a2e'],
          poster: ['light', '#f6f1e6'], ticker: ['dark', '#050505'], book: ['light', '#f7f4ec'],
          blueprint: ['dark', '#0b1e33'], 'star-chart': ['dark', '#050818'], newspaper: ['light', '#faf6ee'],
          chalkboard: ['dark', '#2b3339'], 'beige-box': ['light', '#d9d3c4'], classic: ['dark', '#0a0e14'],
        }
        const DEFAULT_MEDIUM = 'classic' // flips to 'gallery' at Phase 3 cutover
        try {
          const saved = JSON.parse(localStorage.getItem('valuesignal.ui-preferences.v1') || '{}')
          const dark = saved.theme === 'dark' || (saved.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          const medium = MEDIUM_PAINT[saved.medium] ? saved.medium : DEFAULT_MEDIUM
          document.documentElement.dataset.medium = medium
          const [colorScheme, themeColor] = MEDIUM_PAINT[medium]
          document.documentElement.style.colorScheme = colorScheme
          document.querySelector('#theme-color-meta').content = themeColor
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.medium = DEFAULT_MEDIUM
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
