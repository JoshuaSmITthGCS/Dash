<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ValueSignal — Fundamentals-first investment research</title>
    <meta name="description" content="Explainable company research across valuation, quality, financial health, growth, market behavior, and news sentiment." />

    <!-- iPhone home-screen app behavior: full-screen standalone launch, matching status bar, real icon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f1f3f1" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ValueSignal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('valuesignal.ui-preferences.v1') || '{}')
          const dark = saved.theme === 'dark' || (saved.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.querySelector('#theme-color-meta').content = dark ? '#07110c' : '#f1f3f1'
        } catch { document.documentElement.dataset.theme = 'light' }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
