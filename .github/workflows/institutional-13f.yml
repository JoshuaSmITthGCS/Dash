name: Collect institutional 13F positions

on:
  workflow_dispatch: {}
  schedule:
    # Monthly, not daily or weekly: 13F holdings are inherently quarterly and filed up to
    # 45 days after quarter-end, so there is nothing to gain from polling more often than
    # a new quarter could plausibly have landed. 1st of the month, 13:00 UTC.
    - cron: '0 13 1 * *'

permissions:
  contents: write

concurrency:
  group: institutional-13f-main
  cancel-in-progress: false

jobs:
  collect:
    # Scheduled runs stay on main. A manual dispatch is allowed from any branch so a change
    # to the collector can be exercised against live EDGAR *before* it is merged - the
    # commit step below is what stays gated on main, so a branch run publishes nothing.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Long enough for a *first* CUSIP mapping pass without a key: OpenFIGI's anonymous tier
    # takes 10 CUSIPs per request at 25 requests a minute, so several thousand first-seen
    # CUSIPs is a quarter of an hour of pacing. Later runs read the committed
    # pipeline/data/institutional_13f/cusip_tickers.json cache and finish in seconds.
    # Setting the (free) OPENFIGI_API_KEY secret raises the batch to 100 and removes the wait.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Collect curated-manager 13F positions and map CUSIPs via OpenFIGI
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python pipeline/build_institutional_screen.py
      - name: Summarise what was collected
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          payload = json.load(open("public/data/screens/institutional-13f.json"))
          print(f"**Status:** `{payload.get('status')}`\n")
          if payload.get("degraded_reason"):
              print(f"> {payload['degraded_reason']}\n")
          print(f"- managers reviewed: {payload.get('managers_reviewed')} "
                f"of {payload.get('managers_configured')}")
          print(f"- CUSIPs seen: {payload.get('cusips_seen')}, "
                f"mapped: {payload.get('cusips_mapped')}, "
                f"still pending: {payload.get('cusips_pending')}")
          print(f"- OpenFIGI tier: `{payload.get('openfigi_tier')}` "
                "(set the free OPENFIGI_API_KEY secret for 100-CUSIP batches)")
          for error in payload.get("openfigi_errors") or []:
              print(f"- OpenFIGI error: `{error}`")
          print(f"- results published: {len(payload.get('results') or [])}\n")
          print("| Manager | Filer CIKs | Periods | Holdings | Notes |")
          print("| --- | --- | --- | --- | --- |")
          for row in payload.get("manager_coverage") or []:
              print(f"| {row['manager']} | {', '.join(row['filer_ciks']) or '–'} "
                    f"| {', '.join(row['periods']) or '–'} | {row['holdings_parsed']} "
                    f"| {'; '.join(row['notes'])[:300] or '–'} |")
          PY
          cat "$GITHUB_STEP_SUMMARY"
      - name: Commit collected data with retry
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add --all pipeline/data/institutional_13f 2>/dev/null || true
          git add public/data/screens/institutional-13f.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): collect institutional 13F positions"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
