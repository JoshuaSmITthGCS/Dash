name: Collect institutional 13F positions

on:
  workflow_dispatch: {}
  schedule:
    # Monthly, not daily or weekly: 13F holdings are inherently quarterly and filed up to
    # 45 days after quarter-end, so there is nothing to gain from polling more often than
    # a new quarter could plausibly have landed. 1st of the month, 13:00 UTC.
    - cron: '0 13 1 * *'

permissions:
  contents: write

concurrency:
  group: institutional-13f-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Collect curated-manager 13F positions and map CUSIPs via OpenFIGI
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python pipeline/build_institutional_screen.py
      - name: Commit collected data with retry
        shell: bash
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add --all pipeline/data/institutional_13f 2>/dev/null || true
          git add public/data/screens/institutional-13f.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): collect institutional 13F positions"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
