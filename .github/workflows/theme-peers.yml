name: Re-rank theme peers

# The "Connected, not yet re-rated" tier of the theme screen, re-scored across the whole
# sector-peer pool instead of the 120-name slice the daily refresh can afford.
#
# Why this is a separate workflow rather than a wider budget inside refresh-advisor.yml:
# themes.TOTAL_SECTOR_PEER_BUDGET is capped at 120 because each peer costs up to two 10-K
# documents inside the refresh's own response cache, which has a hard size limit. Moving the
# work here spends a different cache under a different key, so widening peer coverage cannot
# push the refresh's footprint over that limit or add to its runtime.
#
# It reads the committed advisor.json and polls no market data: no Yahoo request, no Alpha
# Vantage quota, no rescoring. SEC EDGAR is the only network dependency.

on:
  workflow_dispatch:
    inputs:
      rows_per_theme:
        description: Published rows per theme (default 10)
        required: false
        default: '10'
        type: string
      candidate_limit:
        description: Cap on peers scored; 0 evaluates the whole pool
        required: false
        default: '0'
        type: string
  schedule:
    # 09:30 EDT / 08:30 EST on weekdays - after the 07:00 ET full sweep has committed, in
    # both DST regimes, so this always reads the morning's fresh advisor.json rather than
    # yesterday's. Nothing here is time-sensitive beyond that ordering, so unlike the
    # refresh it needs no Eastern-hour gate: a late start still reads the same snapshot.
    - cron: '30 13 * * 1-5'

permissions:
  contents: write

concurrency:
  group: theme-peers-main
  cancel-in-progress: false

jobs:
  peers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ~330 candidates against 11 themes. Each company's filings are read once and measured
    # against every theme (see build_theme_screen's loop ordering), and EDGAR is rate-limited
    # to 9 requests/second, so the wall time is filing reads rather than scoring.
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      THEME_PEERS_ROWS_PER_THEME: ${{ inputs.rows_per_theme || '10' }}
      THEME_PEERS_CANDIDATE_LIMIT: ${{ inputs.candidate_limit || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore the theme-peers EDGAR cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/cache
          # A key of its own, deliberately not shared with pipeline-data-cache-*. The peer
          # budget this job exists to lift was sized by the refresh cache's limit; restoring
          # and re-saving that same cache here would put the 10-K documents straight back
          # into the store the cap was protecting.
          key: theme-peers-cache-${{ github.run_id }}
          restore-keys: |
            theme-peers-cache-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Score the sector-connected tier
        run: python pipeline/build_theme_peers.py
      - name: Validate
        run: python pipeline/validate_data.py
      - name: Commit the re-ranked peer screen
        shell: bash
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): re-rank theme sector peers"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
