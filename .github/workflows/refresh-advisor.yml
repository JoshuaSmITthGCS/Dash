name: Refresh advisor data

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: Data providers to refresh
        required: true
        default: data-only
        type: choice
        options:
          - data-only
          - full-alpha
      universe_scope:
        description: Full ~900-name sweep, or just the prior top 100 (+ holdings)
        # Not required: the GitHub REST dispatch API (unlike the web UI's "Run workflow"
        # form) does not apply `default` when a caller omits an input, and rejects the
        # whole dispatch with a 422 if a required one is missing. The site's refresh
        # button calls this via netlify/functions/refresh-data.mjs, which predates this
        # input - required:true here would break every button click until that function
        # is updated to match. `inputs.universe_scope || 'full'` below covers the blank.
        required: false
        default: full
        type: choice
        options:
          - full
          - fast
      portfolio_symbols:
        description: Optional comma-separated portfolio tickers to include
        required: false
        default: ''
        type: string
  schedule:
    # GitHub cron is UTC. Trigger both EDT/EST candidates, then gate on New York time.
    # 08:00 ET is the one full sweep of the day (all ~900 stocks); 12:00 and 15:00 ET are
    # fast refreshes limited to the prior top 100 plus portfolio holdings - see the
    # "Select the Eastern-time refresh window" step below for how that's enforced.
    - cron: '0 12,13,16,17,19,20 * * 1-5'

permissions:
  contents: write

concurrency:
  group: scheduled-data-push-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A ~900-name stock universe and a ~125-fund ETF watchlist, plus financial statements
    # for the shortlist. Price history is batched and everything is cached, so most of the
    # wall time is deliberate rate-limit pacing rather than transfer.
    timeout-minutes: 90
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # SEC fair-access policy requires a real contact string. Without it the Form 4
      # insider layer and the theme-exposure screen both report themselves unavailable
      # rather than spoofing a client.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ALPHA_ENRICH_LIMIT: '5'
      ALPHA_VANTAGE_CALL_DELAY: '0'
      ADVISOR_PORTFOLIO_SYMBOLS: ${{ inputs.portfolio_symbols || '' }}
    steps:
      - name: Select the Eastern-time refresh window
        id: refresh_window
        shell: bash
        run: |
          should_run=false
          alpha_disable=1
          universe_mode=fast
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            should_run=true
            universe_mode="${{ inputs.universe_scope || 'full' }}"
            if [[ "${{ inputs.refresh_mode }}" == "full-alpha" ]]; then
              alpha_disable=0
            fi
          else
            local_hour="$(TZ=America/New_York date +%H)"
            case "$local_hour" in
              08)
                should_run=true
                alpha_disable=0
                universe_mode=full
                ;;
              12|15)
                should_run=true
                universe_mode=fast
                ;;
            esac
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "ALPHA_DISABLE=$alpha_disable" >> "$GITHUB_ENV"
          echo "ADVISOR_UNIVERSE_MODE=$universe_mode" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.refresh_window.outputs.should_run == 'true'
        with:
          fetch-depth: 0
      - name: Restore the Yahoo/Alpha Vantage/SEC response cache
        if: steps.refresh_window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: pipeline/data/cache
          # The exact key never matches (run_id is unique), so this always falls through to
          # restore-keys and picks up the most recent cache, then saves a fresh one at the
          # end of the job. That's what makes the fast (top-100) runs actually fast, and
          # cache.py's own TTLs (6h price history, 15min quotes) decide what's still fresh
          # enough to skip re-fetching.
          key: pipeline-data-cache-${{ github.run_id }}
          restore-keys: |
            pipeline-data-cache-
      - uses: actions/setup-python@v5
        if: steps.refresh_window.outputs.should_run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - if: steps.refresh_window.outputs.should_run == 'true'
        run: pip install -r pipeline/requirements.txt
      - name: Append point-in-time estimate snapshots
        if: steps.refresh_window.outputs.should_run == 'true'
        run: python pipeline/collect_estimates.py || echo "::warning::Estimate collection failed; no history was backfilled"
      - name: Fetch and score stock research
        if: steps.refresh_window.outputs.should_run == 'true'
        run: python pipeline/fetch_advisor.py
      - name: Fetch ETF growth screen
        if: steps.refresh_window.outputs.should_run == 'true'
        # ETFs are evaluated independently of the stock universe; a Yahoo hiccup here
        # shouldn't block the stock research refresh, so keep the previous etfs.json on failure.
        run: python pipeline/fetch_etfs.py || echo "::warning::ETF fetch failed; keeping previous etfs.json"
      - name: Build ETF comparison contracts
        if: steps.refresh_window.outputs.should_run == 'true'
        run: python pipeline/build_etf_comparisons.py
      - name: Validate
        if: steps.refresh_window.outputs.should_run == 'true'
        run: python pipeline/validate_data.py
      - name: Commit refreshed data with retry
        if: steps.refresh_window.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # Every file this pipeline can write under public/data/, not an explicit
          # allowlist: public/data/diagnostics.json was added by fetch_advisor.py without
          # ever being added here, which silently left it uncommitted on every run since -
          # `git commit` would succeed, then `git pull --rebase` below would fail with
          # "You have unstaged changes" on that one leftover file, so no refresh ever
          # actually published again. An allowlist can drift out of sync with what the
          # scripts write; `git add public/data` cannot.
          git add public/data
          # The point-in-time store is committed because the runner is ephemeral. It cannot
          # be rebuilt later - the providers only ever serve today's restated numbers - so
          # the history only exists if each run appends to it and pushes the result.
          git add --all pipeline/data/pit 2>/dev/null || true
          git add --all pipeline/data/estimates 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): refresh advisor research"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
