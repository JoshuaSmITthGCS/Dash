name: Refresh advisor data

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: Data providers to refresh
        required: true
        default: data-only
        type: choice
        options:
          - data-only
          - full-alpha
  schedule:
    # GitHub cron is UTC. Trigger both EDT/EST candidates, then gate on New York time.
    - cron: '0 11,12,16,17,19,20 * * 1-5'

permissions:
  contents: write

concurrency:
  group: scheduled-data-push-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A ~330-name universe plus financial statements for the shortlist needs a wider window
    # than the old 120-name price-only pass.
    timeout-minutes: 50
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHA_ENRICH_LIMIT: '5'
      ALPHA_VANTAGE_CALL_DELAY: '0'
    steps:
      - name: Select the Eastern-time refresh window
        id: refresh_window
        shell: bash
        run: |
          should_run=false
          alpha_disable=1
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            should_run=true
            if [[ "${{ inputs.refresh_mode }}" == "full-alpha" ]]; then
              alpha_disable=0
            fi
          else
            local_hour="$(TZ=America/New_York date +%H)"
            case "$local_hour" in
              07)
                should_run=true
                alpha_disable=0
                ;;
              12|15)
                should_run=true
                ;;
            esac
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "ALPHA_DISABLE=$alpha_disable" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.refresh_window.outputs.should_run == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.refresh_window.outputs.should_run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - if: steps.refresh_window.outputs.should_run == 'true'
        run: pip install -r pipeline/requirements.txt
      - name: Fetch, score, and validate in one chain
        if: steps.refresh_window.outputs.should_run == 'true'
        run: python pipeline/fetch_advisor.py && python pipeline/validate_data.py
      - name: Commit refreshed data with retry
        if: steps.refresh_window.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/advisor.json public/data/status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): refresh advisor research"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
