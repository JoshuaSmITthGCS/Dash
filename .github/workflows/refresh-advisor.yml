name: Refresh advisor data

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: Data providers to refresh
        required: true
        default: data-only
        type: choice
        options:
          - data-only
          - full-alpha
          # Re-runs the scoring layer over the last published advisor.json with zero
          # network calls - use this after a scoring/canonical-metrics code change, when
          # nothing about the underlying data itself needs to change. See pipeline/rescore.py.
          - rescore-only
      universe_scope:
        description: Full ~900-name sweep, or just the prior top 100 (+ holdings)
        # Not required: the GitHub REST dispatch API (unlike the web UI's "Run workflow"
        # form) does not apply `default` when a caller omits an input, and rejects the
        # whole dispatch with a 422 if a required one is missing. The site's refresh
        # button calls this via netlify/functions/refresh-data.mjs, which predates this
        # input - required:true here would break every button click until that function
        # is updated to match. `inputs.universe_scope || 'full'` below covers the blank.
        required: false
        default: full
        type: choice
        options:
          - full
          - fast
      portfolio_symbols:
        description: Optional comma-separated portfolio tickers to include
        required: false
        default: ''
        type: string
      focus_symbols:
        # A re-ranking request for one named set - the theme screen's re-run button sends
        # its own members. Kept separate from portfolio_symbols, which means "the user owns
        # this" and would relabel every re-ranked name as a holding.
        description: Optional comma-separated tickers to re-poll and re-rank, and nothing else
        required: false
        default: ''
        type: string
  schedule:
    # GitHub cron is UTC. Trigger both EDT/EST candidates, then gate on New York time.
    # Weekdays: all three slots (07:00, 12:00, 15:00 ET) are now full sweeps (all ~900
    # stocks) - see the "Select the Eastern-time refresh window" step below for how
    # that's enforced. This used to be one full sweep plus two fast (prior-top-100)
    # refreshes; the fast slots were dropped in favor of always-full after a fast
    # refresh was found to silently undo a chunk of the previous full sweep's effect -
    # not by discarding the newly-enriched data (carry-forward preserves that), but by
    # rescoring the whole cross-section against CrossSectionalNormalizer.from_published's
    # STALE, previously-published normalization basis instead of refitting one fresh
    # (full mode's fit_source: "current_full_refresh" vs fast mode's
    # "prior_full_refresh" - see scorer.py/fetch_advisor.py). That produced a broad,
    # roughly uniform score shift a few hours after every full sweep that reverted most
    # of a fresh enrichment's top-40 reranking within one refresh cycle. Always-full
    # keeps every run's normalization basis current instead of stale. The tradeoff is
    # real: three full ~900-name sweeps a day costs roughly 3x the previous daily Yahoo
    # request volume and runtime instead of one full sweep plus two much lighter ones -
    # accepted deliberately, not overlooked.
    # Avoid minute zero, when GitHub documents that scheduled events are most likely to
    # be delayed or dropped under Actions load.
    #
    # These are six separate entries rather than one '7 11,12,16,17,19,20 * * *' line so
    # that `github.event.schedule` identifies WHICH slot fired. Actions only reports the
    # matching cron expression, never the instant it was meant to fire, so a combined entry
    # left the gate below with nothing to read but the wall clock - and scheduled runs in
    # this repo have started 25-60 minutes late (measured across every slot), which is
    # enough to carry a firing into the next Eastern hour and silently reclassify it.
    #
    # Every day, not just weekdays (`* * *`, not `* * 1-5`): the gate step below only lets
    # the weekend 07:00 ET slot through (equity quotes don't move over the weekend, so
    # there's no case for the 12:00/15:00 slots on a non-trading day), but Alpha Vantage,
    # statement enrichment (10-Ks/10-Qs/8-Ks file on any day), SEC filings, and news don't
    # stop either, so that single weekend run raises ALPHA_ENRICH_LIMIT to 25 - Alpha
    # Vantage's real free-tier daily ceiling, not the 5-per-refresh weekday figure sized
    # for the one weekday slot Alpha Vantage still runs on (07:00 ET; 12:00/15:00 stay
    # Yahoo-only to keep the free-tier daily quota from being split three ways) - and
    # paces calls with a 13s ALPHA_VANTAGE_CALL_DELAY (5 req/min limit) so that run is
    # mainly a universe enrichment pass, not a mirror of the weekday cadence. Themes need
    # no separate schedule entry -- build_theme_layer already runs unconditionally inside
    # fetch_advisor.py's run() on every non-rescore refresh, so it fires on the weekend
    # run too.
    #
    #                    EDT (UTC-4)        EST (UTC-5)
    - cron: '7 11 * * *'  # 07:00 full sweep | 06:00 no-op
    - cron: '7 12 * * *'  # 08:00 no-op      | 07:00 full sweep
    - cron: '7 16 * * *'  # 12:00 full sweep | 11:00 no-op
    - cron: '7 17 * * *'  # 13:00 no-op      | 12:00 full sweep
    - cron: '7 19 * * *'  # 15:00 full sweep | 14:00 no-op
    - cron: '7 20 * * *'  # 16:00 no-op      | 15:00 full sweep

permissions:
  contents: write

concurrency:
  group: scheduled-data-push-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A ~900-name stock universe and a ~125-fund ETF watchlist, plus financial statements
    # for every scored name. Price history is batched and everything is cached, so most of
    # the wall time is deliberate rate-limit pacing rather than transfer.
    #
    # Raised from 90 alongside advisor_universe.json's extended_limit, which no longer caps
    # statement enrichment at 150 names. Measured on the 2026-08-24 full sweep, enrichment
    # ran at 0.92s/name for 138s of a 41-minute scoring step; at ~880 scored names that leg
    # becomes roughly 15 minutes, and the tail is slower per name than the large caps that
    # figure was measured on (obscurer names miss Yahoo more often and fall through to the
    # slower EDGAR fallback). That put the projected full sweep near 70 minutes against a
    # 90-minute ceiling. A timeout publishes nothing at all - the commit step never runs -
    # so the margin matters more than the minutes do. This budget now applies to every
    # weekday slot (07:00/12:00/15:00 ET are all full sweeps - see the schedule comment
    # above), not just one run a day; the concurrency group below still serializes runs
    # rather than letting a late one overlap the next slot's start.
    timeout-minutes: 120
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # SEC fair-access policy requires a real contact string. Without it the Form 4
      # insider layer and the theme-exposure screen both report themselves unavailable
      # rather than spoofing a client.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ALERT_DELIVERY_URL: ${{ secrets.ALERT_DELIVERY_URL }}
      ALERT_DELIVERY_SECRET: ${{ secrets.ALERT_DELIVERY_SECRET }}
      ALPHA_ENRICH_LIMIT: '5'
      ALPHA_VANTAGE_CALL_DELAY: '0'
      ADVISOR_PORTFOLIO_SYMBOLS: ${{ inputs.portfolio_symbols || '' }}
      ADVISOR_FOCUS_SYMBOLS: ${{ inputs.focus_symbols || '' }}
      # Price histories are downloaded in batches, while quote snapshots use bounded
      # concurrency behind cache.py's shared 4-request/second Yahoo limiter.
      YAHOO_BATCH_SIZE: '100'
      YAHOO_QUOTE_WORKERS: '10'
      # Unlike ENABLE_OPTIONS_VOLATILITY (left off - see fetch_advisor.py), the multi-day
      # options screen is a real, user-facing feature, so its own extra options-chain
      # requests are enabled here rather than left opt-in.
      ENABLE_MULTIDAY_OPTIONS_SCREEN: '1'
    steps:
      - name: Select the Eastern-time refresh window
        id: refresh_window
        shell: bash
        run: |
          should_run=false
          alpha_disable=1
          universe_mode=fast
          is_rescore=false
          alpha_enrich_limit=5
          alpha_call_delay=0
          # True only for the one slot a day meant to carry the once-daily-only legs
          # (the delisted-name price-archive leg, the Live v2 controlled validation) -
          # decoupled from universe_mode because every weekday slot is a full sweep now
          # (see the schedule comment above `on:`), and those two legs must still run
          # once, not three times.
          is_daily_archive=false

          # The Eastern hour this run was SCHEDULED for, derived from the cron entry that
          # fired rather than from `date` at execution time.
          #
          # Actions routinely starts a scheduled run late - every slot in this workflow has
          # been observed 25-60 minutes behind its cron minute, and the 12:07 UTC slot ran
          # 56, 57, 58 and 60 minutes late on four consecutive weekdays. The wall clock
          # therefore does not identify the window: only 53 minutes of slack separate :07
          # from the next Eastern hour, so a delay of the size this repo already sees on one
          # slot would read the 07:00 ET firing as 08:00, take the no-op branch, and drop the
          # day's ONLY full sweep - reported as a green four-second run indistinguishable
          # from an intentional no-op. Anchoring to the schedule makes the classification
          # independent of how long the run waited for a runner.
          scheduled_hour_et() {
            local cron minute hour rest
            cron="$1"
            minute="${cron%% *}"
            rest="${cron#* }"
            hour="${rest%% *}"
            [[ "$minute" =~ ^[0-9]{1,2}$ && "$hour" =~ ^[0-9]{1,2}$ ]] || return 1
            # 10# so a zero-padded cron field is read as decimal, not octal.
            TZ=America/New_York date \
              -d "$(date -u +%Y-%m-%d)T$(printf '%02d:%02d' "$((10#$hour))" "$((10#$minute))")Z" \
              +%H
          }

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            should_run=true
            universe_mode="${{ inputs.universe_scope || 'full' }}"
            window="manual ${{ inputs.refresh_mode }} / ${universe_mode} universe"
            if [[ "${{ inputs.refresh_mode }}" == "full-alpha" ]]; then
              alpha_disable=0
            elif [[ "${{ inputs.refresh_mode }}" == "rescore-only" ]]; then
              is_rescore=true
            fi
            # A manual full-scope dispatch is the same "give this one run the once-daily
            # legs" case as the scheduled once-a-day slot below - preserves the pre-
            # always-full behavior (this was the only signal those two steps had) for
            # anyone dispatching a full sweep by hand.
            [[ "$universe_mode" == "full" ]] && is_daily_archive=true
          else
            if ! local_hour="$(scheduled_hour_et '${{ github.event.schedule }}')"; then
              # An unparseable cron expression must not cost a refresh: fall back to the
              # wall clock, which is what this gate used before, and say so in the summary.
              local_hour="$(TZ=America/New_York date +%H)"
              echo "::warning::Could not read the cron entry that fired \
          ('${{ github.event.schedule }}'); classified this run by wall clock instead"
            fi
            # 1 (Mon) .. 7 (Sun): a weekend refresh is once daily, not three times -
            # equity quotes don't move on a non-trading day, so the 12:00/15:00 intraday
            # fast reruns that exist to catch same-day price movement have nothing new to
            # catch. That "spare" capacity goes to Alpha Vantage/statement enrichment
            # instead: weekdays cap ALPHA_ENRICH_LIMIT at 5 because the same daily quota
            # also has to last three refreshes, but the weekend's single run can safely ask
            # for the real free-tier ceiling of 25 since nothing else that day competes for
            # it. ALPHA_VANTAGE_CALL_DELAY=13 keeps 25 calls under the 5-calls-per-minute
            # sub-limit (60s / 5 = 12s minimum spacing; 13s for margin). Computed from the
            # wall clock rather than the schedule: the lateness this gate corrects for
            # (25-60 minutes) is nowhere near enough to cross a day boundary except right at
            # midnight ET, so the added complexity of a schedule-anchored day isn't earning
            # its keep the way schedule-anchored HOUR does above.
            local_day="$(TZ=America/New_York date +%u)"
            if [[ "$local_day" -ge 6 ]]; then
              if [[ "$local_hour" == "07" ]]; then
                should_run=true
                alpha_disable=0
                universe_mode=full
                alpha_enrich_limit=25
                alpha_call_delay=13
                is_daily_archive=true
                window="${local_hour}:00 ET - weekend full sweep + enrichment (~900 names, Alpha Vantage enabled, enrich limit 25)"
              else
                window="${local_hour}:00 ET - weekend, outside the once-daily refresh window, nothing to do"
              fi
            else
              case "$local_hour" in
                07)
                  should_run=true
                  alpha_disable=0
                  universe_mode=full
                  is_daily_archive=true
                  window="${local_hour}:00 ET - full sweep (~900 names, Alpha Vantage enabled)"
                  ;;
                12|15)
                  should_run=true
                  universe_mode=full
                  window="${local_hour}:00 ET - full sweep (~900 names, Yahoo-only)"
                  ;;
                *)
                  window="${local_hour}:00 ET - outside every refresh window, nothing to do"
                  ;;
              esac
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "is_rescore=$is_rescore" >> "$GITHUB_OUTPUT"
          echo "universe_mode=$universe_mode" >> "$GITHUB_OUTPUT"
          echo "is_daily_archive=$is_daily_archive" >> "$GITHUB_OUTPUT"
          echo "ALPHA_DISABLE=$alpha_disable" >> "$GITHUB_ENV"
          echo "ADVISOR_UNIVERSE_MODE=$universe_mode" >> "$GITHUB_ENV"
          echo "ALPHA_ENRICH_LIMIT=$alpha_enrich_limit" >> "$GITHUB_ENV"
          echo "ALPHA_VANTAGE_CALL_DELAY=$alpha_call_delay" >> "$GITHUB_ENV"
          # A gated-off run is a four-second success on the runs list, which looks exactly
          # like a broken one. Name the selected window on the run's own summary page so
          # "did today's full sweep actually happen?" is answerable without reading logs.
          {
            echo "### Refresh window: $window"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Cron entry | \`${{ github.event.schedule || 'n/a' }}\` |"
            echo "| Pipeline runs | $should_run |"
            echo "| Universe mode | $universe_mode |"
            echo "| Once-daily legs (price archive, Live v2) | $is_daily_archive |"
            echo "| Alpha Vantage enrich limit | $alpha_enrich_limit (call delay ${alpha_call_delay}s) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: steps.refresh_window.outputs.should_run == 'true'
        with:
          fetch-depth: 0
      - name: Restore the Yahoo/Alpha Vantage/SEC response cache
        if: steps.refresh_window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: pipeline/data/cache
          # The exact key never matches (run_id is unique), so this always falls through to
          # restore-keys and picks up the most recent cache, then saves a fresh one at the
          # end of the job. That's what makes the fast (top-100) runs actually fast, and
          # cache.py's own TTLs (6h price history, 15min quotes) decide what's still fresh
          # enough to skip re-fetching.
          key: pipeline-data-cache-${{ github.run_id }}
          restore-keys: |
            pipeline-data-cache-
      - uses: actions/setup-python@v5
        if: steps.refresh_window.outputs.should_run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - if: steps.refresh_window.outputs.should_run == 'true'
        run: pip install -r pipeline/requirements.txt
      - name: Append point-in-time estimate snapshots
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        run: python pipeline/collect_estimates.py || echo "::warning::Estimate collection failed; no history was backfilled"
      - name: Fetch and score stock research
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        run: python pipeline/fetch_advisor.py
      - name: Build Momentum screen from the price history just fetched
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        # Reads the same on-disk Yahoo price cache the previous step just warmed - no new
        # network calls - so a failure here shouldn't take down the rest of the refresh.
        run: python pipeline/build_momentum_screen.py || echo "::warning::Momentum screen build failed; keeping previous momentum.json"
      - name: Archive today's closes (survivorship price archive)
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true' && steps.refresh_window.outputs.is_daily_archive == 'true'
        # Gated on is_daily_archive, not universe_mode == 'full': every weekday slot is a
        # full sweep now (see the schedule comment above `on:`), but this leg still must
        # run only once a day. The live-universe leg is free (same warmed cache as the
        # Momentum screen above), but the recently-delisted leg makes real Yahoo calls by
        # design (see price_archive.py DELISTING_RETENTION_DAYS), and that cost shouldn't
        # be paid three times a day.
        run: python pipeline/price_archive.py daily || echo "::warning::Price archive run failed; archive_health will reflect the gap"
      - name: Build multi-day options, covered-call, cash-secured-put, and short-term-trades screens from one shared chain fetch per ticker
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        # build_options_strategies.py fetches ONE option chain per ticker (both mechanisms
        # share the same 1-14-day window) and derives all four of these screens from it -
        # one extra options-chain request per ticker on top of what fetch_advisor.py already
        # pulled, not four. Replaces build_options_screen.py/build_covered_call_screen.py/
        # build_cash_secured_put_screen.py's own run() as the live-data source for
        # options.json/covered-calls.json/cash-secured-puts.json; those three files' run()
        # functions still exist and are still directly testable, they're just not what's
        # called here anymore. A Yahoo hiccup here shouldn't block the rest of the refresh.
        run: python pipeline/build_options_strategies.py || echo "::warning::Options strategies build failed; keeping previous screen files"
      - name: Build protective-put screen from the price history just fetched
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        # Protective put, collar, vertical spread, and advanced strategies each still cost
        # their own options-chain request per ticker on top of the shared fetch above - left
        # opt-in (ENABLE_*_SCREEN unset here) same as ENABLE_OPTIONS_VOLATILITY in
        # fetch_advisor.py, so four more full sweeps of the universe don't silently multiply
        # this job's Yahoo request volume and runtime. Set the matching env var to enable one.
        run: python pipeline/build_protective_put_screen.py || echo "::warning::Protective-put screen build failed; keeping previous protective-puts.json"
      - name: Build collar screen from the price history just fetched
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        run: python pipeline/build_collar_screen.py || echo "::warning::Collar screen build failed; keeping previous collars.json"
      - name: Build vertical-spread screen from the price history just fetched
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        run: python pipeline/build_vertical_spread_screen.py || echo "::warning::Vertical-spread screen build failed; keeping previous vertical-spreads.json"
      - name: Build advanced-strategies screen from the price history just fetched
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        run: python pipeline/build_advanced_options_screen.py || echo "::warning::Advanced-strategies screen build failed; keeping previous advanced-strategies.json"
      - name: Run every options strategy's walk-forward backtest
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        # Unlike the live scanners above, every backtest here prices its option legs with
        # Black-Scholes off the price history already cached by fetch_advisor.py - no live
        # option-chain request, so it costs nothing extra against Yahoo's rate limiter and
        # runs unconditionally rather than behind an ENABLE_* flag.
        run: python pipeline/run_strategy_backtests.py || echo "::warning::Strategy backtests failed; keeping previous *-backtest.json files"
      - name: Fetch ETF growth screen
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        # ETFs are evaluated independently of the stock universe; a Yahoo hiccup here
        # shouldn't block the stock research refresh, so keep the previous etfs.json on failure.
        run: python pipeline/fetch_etfs.py || echo "::warning::ETF fetch failed; keeping previous etfs.json"
      - name: Build ETF comparison contracts
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        run: python pipeline/build_etf_comparisons.py
      - name: Refresh monthly factor data
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        run: python pipeline/fetch_factors.py || echo "::warning::Factor refresh failed; keeping previous factor data"
      - name: Rescore the last published data (no network calls)
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_rescore == 'true'
        run: python pipeline/rescore.py
      - name: Build the quality-at-valuation-lows screen
        if: steps.refresh_window.outputs.should_run == 'true'
        # Reads only what is already on disk - the advisor snapshot just written, the backtest
        # cache's closes and statements, and the point-in-time observation store - so it runs
        # on the rescore path too, and costs no provider requests either way.
        run: python pipeline/build_quality_value_screen.py || echo "::warning::Quality-value screen build failed; keeping previous quality-value.json"
      - name: Build the swing-horizon screen
        if: steps.refresh_window.outputs.should_run == 'true'
        # Same disk-only inputs as the quality-value screen above (the advisor snapshot plus
        # the backtest cache's closes and volumes), so it runs on the rescore path too and
        # costs no provider requests.
        run: python pipeline/build_swing_screen.py || echo "::warning::Swing screen build failed; keeping previous swing.json"
      - name: Build the earnings-timeliness and structural-tactical screens
        if: steps.refresh_window.outputs.should_run == 'true'
        # Must precede shadow_portfolios.py, which selects a sleeve from structural-tactical.json.
        run: python pipeline/build_tactical_screens.py || echo "::warning::Tactical screen build failed; keeping previous earnings-timeliness.json and structural-tactical.json"
      - name: Append and publish prospective shadow portfolios
        if: steps.refresh_window.outputs.should_run == 'true'
        # Must follow build_swing_screen.py and the congress/institutional screens: the
        # swing-only and political+institutional strategies select from those files.
        run: python pipeline/shadow_portfolios.py
      - name: Append prospective production and benchmark sector weights
        if: steps.refresh_window.outputs.should_run == 'true'
        run: python pipeline/sector_weight_history.py
      - name: Backtest following disclosed political and institutional trades
        if: steps.refresh_window.outputs.should_run == 'true'
        # Reads the two published disclosure screens and the cached price history, so it
        # costs no provider request and finishes in seconds. Its window only deepens as the
        # disclosure stores do, which is exactly why it reruns on every refresh.
        run: python pipeline/backtest_political_institutional.py || echo "::warning::Political/institutional backtest failed; keeping previous results"
      - name: Rebuild the cross-method backtest comparison
        if: steps.refresh_window.outputs.should_run == 'true'
        # Pure aggregation over result files already on disk. Runs last so it picks up every
        # backtest refreshed earlier in this job.
        run: python pipeline/build_backtest_comparison.py || echo "::warning::Backtest comparison build failed; keeping previous backtest-comparison.json"
      - name: Rebuild signal and research validation artifacts
        if: steps.refresh_window.outputs.should_run == 'true'
        run: |
          python pipeline/score_calibration.py
          python pipeline/enrichment_bias.py
          python pipeline/experiment_registry.py
          python pipeline/signal_metrics.py
          python pipeline/build_research_evidence.py
      - name: Refresh the controlled Live v2 representative validation
        if: steps.refresh_window.outputs.should_run == 'true' && steps.refresh_window.outputs.is_daily_archive == 'true' && steps.refresh_window.outputs.is_rescore != 'true'
        # Gated on is_daily_archive, not universe_mode == 'full' (every weekday slot is a
        # full sweep now - see the schedule comment above `on:`), to keep this at its
        # original once-a-day cadence rather than tripling for no measurement gain: it's a
        # fixed 10-ticker representative check, not a load concern, but a validation
        # artifact compared run-over-run is more useful sampled once daily than thrice.
        # The script always writes explicit per-ticker failures before returning nonzero.
        # Keep that evidence and publish it rather than aborting before the commit step.
        run: python pipeline/live_v2_validation.py || echo "::warning::One or more controlled Live v2 checks failed; publishing the failure artifact"
      - name: Validate
        if: steps.refresh_window.outputs.should_run == 'true'
        run: python pipeline/validate_data.py
      - name: Rank-turnover and score-stability diagnostics
        if: steps.refresh_window.outputs.should_run == 'true'
        run: python pipeline/stability_report.py || echo "::warning::Stability report failed; keeping previous stability.json"
      - name: Evaluate user alert rules
        if: steps.refresh_window.outputs.should_run == 'true'
        run: python pipeline/evaluate_alerts.py
      - name: Commit refreshed data with retry
        if: steps.refresh_window.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # Everything this run wrote, not a per-directory allowlist. That allowlist has now
          # broken publishing twice the same way: first public/data/diagnostics.json, then
          # pipeline/backtest_political_institutional_results.json, which
          # backtest_political_institutional.py writes next to its own source rather than
          # under any of the enumerated data directories. Both are tracked files that the
          # pipeline rewrites on every run, and in both cases `git commit` succeeded while
          # `git pull --rebase` below then aborted with "You have unstaged changes" on the
          # one file nobody had listed - so the commit was never pushed and the site kept
          # serving stale data while the job reported only a rebase error.
          #
          # `git add -A` cannot drift out of sync with what the scripts write. What it may
          # NOT pick up is bounded by .gitignore, which already excludes the regenerable
          # provider caches (pipeline/data/cache/, pipeline/logs/, staging). The stores that
          # must survive the ephemeral runner - the point-in-time store, estimate and factor
          # snapshots, the survivorship price archive whose delisted names stop resolving
          # after a few weeks, and the prospective shadow-portfolio store - are all still
          # committed by this, because none of them are ignored.
          git add -A
          git diff --cached --quiet && exit 0
          if [[ "${{ steps.refresh_window.outputs.is_rescore }}" == "true" ]]; then
            git commit -m "chore(data): rescore published research (no data refresh)"
          else
            git commit -m "chore(data): refresh advisor research"
          fi
          for attempt in 1 2 3; do
            # --autostash so that a future output this step somehow still leaves unstaged
            # degrades to "that one file isn't published" instead of "nothing is published":
            # rebase sets it aside and restores it afterwards rather than refusing to run.
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
