name: Collect earnings release datetimes

# Builds the point-in-time store of earnings *release* datetimes that the swing screen's
# post-earnings-drift leg anchors on (spec amendment SA-2026-08-12-02). The source is Form 8-K
# Item 2.02, "Results of Operations and Financial Condition", which a US issuer files on the
# day it releases quarterly results. That is a different filing from the 10-Q and arrives weeks
# earlier, which is the whole reason for using it: a filing-date anchor reports every drift
# window as younger than it is, in the same direction every time.
#
# Without this store the drift leg resolves on nothing and scores nothing. It is the
# highest-weighted leg in the composite at 0.30, so a screen published without this store is a
# four-leg model wearing a five-leg label. The leg is not silently filled in from the filing
# date, by design, so the only way to bring it back is to run this job.
#
# To be clear about what this does and does not buy: it makes the leg work and dates it
# correctly. It is not evidence that the screen predicts anything. The model has no
# out-of-sample record, its prospective clock starts 2026-09-01, and that is unaffected by how
# much data this job collects.
#
# Every run commits the store back to main. Scheduled runs happen on ephemeral runners, so
# committing is the only way the record survives, and it cannot be reconstructed later because
# EDGAR serves the filing but this store's value is in having captured it point-in-time.
#
#   pipeline/data/pit/earnings_releases.jsonl   one record per Item 2.02 8-K, append-only

on:
  workflow_dispatch:
    inputs:
      scope:
        description: How much to fetch
        required: true
        default: full
        type: choice
        options:
          - report-only    # print what the store already covers, fetch nothing
          - sample         # first 25 companies
          - full           # the configured universe
      since:
        description: "Drop releases before this ISO date (blank = all history)"
        required: false
        default: '2015-01-01'
        type: string
  schedule:
    # Weekly. A company files at most quarterly, but earnings arrive in waves across the
    # calendar rather than on one date, so a monthly sweep would leave the leg dark for up to
    # four weeks after a reporting season. The collector is append-only and resumable, so a
    # weekly pass after the first full run is a few hundred cheap requests. Minute 17 rather
    # than 0: GitHub documents scheduled events as most likely to be dropped on the hour.
    - cron: '17 7 * * 1'

permissions:
  contents: write

concurrency:
  group: earnings-release-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # About 860 companies at the SEC's fair-access pace. Most of the wall time is deliberate
    # rate-limit pacing rather than work.
    timeout-minutes: 45
    env:
      # SEC fair-access policy requires a User-Agent naming a real contact address. The job
      # refuses to fetch anything without one rather than sending an anonymous request.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the commit step rebases onto main. This job runs for tens of
          # minutes and main is written by several other scheduled jobs, so it will routinely
          # find main has moved by the time it is ready to push. A shallow clone can rebase,
          # but fragilely; refresh-advisor.yml already fetches full depth for the same reason.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Verify the SEC user agent is configured
        if: inputs.scope != 'report-only'
        run: |
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error::SEC_USER_AGENT is not set. Add it as a repository secret, for" \
                 "example 'ValueSignal research you@example.com'. SEC fair-access policy" \
                 "requires a declaring User-Agent with a contact address."
            exit 1
          fi

      - name: Coverage before this run
        run: |
          PYTHONPATH=pipeline python pipeline/collect_earnings_releases.py --report \
            | tee before.json

      - name: Collect
        if: inputs.scope != 'report-only'
        run: |
          set -o pipefail
          case "${{ inputs.scope || 'full' }}" in
            sample) ARGS="--limit 25" ;;
            *)      ARGS="" ;;
          esac
          SINCE="${{ inputs.since }}"
          if [ -n "${SINCE}" ]; then ARGS="${ARGS} --since ${SINCE}"; fi
          echo "Running: collect_earnings_releases.py ${ARGS}"
          PYTHONPATH=pipeline python pipeline/collect_earnings_releases.py ${ARGS} \
            | tee collection-summary.json

      - name: Summarise into the run log
        if: always()
        run: |
          {
            echo "### Earnings release collection"
            echo ""
            echo "Anchors the swing screen's post-earnings-drift leg on Form 8-K Item 2.02"
            echo "rather than the 10-Q filing date (spec amendment SA-2026-08-12-02)."
            echo ""
            echo "**Before this run**"
            echo '```json'
            cat before.json 2>/dev/null || echo '{}'
            echo '```'
            echo "**This run**"
            echo '```json'
            cat collection-summary.json 2>/dev/null || echo '{"skipped": "report-only"}'
            echo '```'
            if [ -f pipeline/data/pit/earnings_releases.jsonl ]; then
              echo "Records on disk: $(wc -l < pipeline/data/pit/earnings_releases.jsonl)"
              echo "Store size: $(du -h pipeline/data/pit/earnings_releases.jsonl | cut -f1)"
            fi
            echo ""
            echo "Company coverage is not leg coverage. A company with releases on disk still"
            echo "needs its most recent fiscal period to have one inside the lag band before"
            echo "the leg scores it. The screen build reports that as \`pead_anchor_diagnostic\`."
            echo ""
            echo "This job makes the leg work and dates it correctly. It is not evidence that"
            echo "the screen predicts anything: the model has no out-of-sample record and its"
            echo "prospective clock starts 2026-09-01."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the store
        id: commit
        if: inputs.scope != 'report-only'
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/data/pit/earnings_releases.jsonl
          if git diff --cached --quiet; then
            echo "No new releases to commit."
            exit 0
          fi
          RECORDS=$(wc -l < pipeline/data/pit/earnings_releases.jsonl)
          git commit -m "chore(data): earnings release store, ${RECORDS} Item 2.02 records" \
                     -m "Scheduled collection. Anchors the swing screen's drift leg on the" \
                     -m "earnings release datetime rather than the 10-Q filing date."
          # Rebase and retry rather than pushing once. This job runs for tens of minutes while
          # several other scheduled jobs write to main, so losing the race is the normal case,
          # not an exception -- the first run of this workflow collected 33,103 records and
          # then threw all of them away on a rejected push. Only this workflow writes the
          # store and the concurrency group serialises it, so the rebase cannot conflict on
          # that file; a failure here means main moved, and the answer is to move with it.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt ${attempt} lost a race with another writer, retrying."
            sleep $((attempt * 15))
          done
          echo "::error::Could not push the store after 5 attempts. The collected records are" \
               "uploaded as the 'earnings-release-store' artifact on this run, so the fetch" \
               "does not have to be repeated. Download it, commit it manually, or rerun."
          exit 1

      # A failed push used to discard tens of minutes of SEC fetching, because the runner is
      # ephemeral and the store exists nowhere else. The retry loop above should make that
      # unreachable, but the artifact costs nothing and makes the failure recoverable instead
      # of merely diagnosable.
      - name: Preserve the store when the push could not land
        if: failure() && steps.commit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: earnings-release-store
          path: pipeline/data/pit/earnings_releases.jsonl
          retention-days: 14
