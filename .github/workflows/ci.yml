name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m compileall -q pipeline
      - run: python pipeline/check_ui_weights.py
      - run: PYTHONPATH=pipeline python -m pytest pipeline/tests -q
      - run: python pipeline/validation/ic_harness.py --snapshot public/data/advisor.json
      - run: python pipeline/validate_data.py
      # Fails the build when a generated report, README or published artifact claims
      # validation this repository cannot support. The swing model has no out-of-sample
      # record, its prospective clock starts 2026-09-01, and every effect size it quotes is a
      # published gross figure before costs and before decay. Documentation drifts toward
      # confidence on its own, so the defence has to run on every change rather than at review.
      - run: PYTHONPATH=pipeline python pipeline/validate_documentation_claims.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
