name: Publish combined Inside Information screen

on:
  workflow_dispatch: {}
  schedule:
    # Every 3 days, offset an hour after sec-filings.yml. This only re-reads the last
    # publish of the congress and institutional-13f screens (weekly and monthly
    # respectively) and republishes their notable-only merge - no network calls of its
    # own, so there's no cost to checking this often even though the two source screens
    # refresh less frequently.
    - cron: '0 14 */3 * *'

permissions:
  contents: write

concurrency:
  group: inside-information-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Merge and filter the congress + institutional 13F screens
        run: python pipeline/build_inside_information_screen.py
      - name: Summarise what was published
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          payload = json.load(open("public/data/screens/inside-information.json"))
          print(f"**Status:** `{payload.get('status')}`\n")
          print(f"- ranked tickers considered: {payload.get('ranked_count')}")
          print(f"- notable tickers published: {payload.get('notable_count')}")
          for row in (payload.get("results") or [])[:20]:
              print(f"  - {row['ticker']}: score {row['score']} "
                    f"(institutional_flag={row.get('institutional_flag')}, "
                    f"congress_flags={row.get('congress_flags')})")
          PY
          cat "$GITHUB_STEP_SUMMARY"
      - name: Commit published screen with retry
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/screens/inside-information.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): publish combined Inside Information screen"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
