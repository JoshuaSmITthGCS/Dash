name: E2E (Playwright harness)

# Phase 3 hard gate (rebuild plan): the twelve-medium harness runs in the exact pinned
# Playwright Docker image so screenshot baselines never churn from a font-rendering or GPU
# difference between CI and a contributor's machine. Runs on every push/PR that touches the
# mediums system or the harness itself — deliberately scoped, since this suite is the slowest
# in the repo and most changes elsewhere in the app don't touch what it covers.

on:
  push:
    branches: [main]
    paths:
      - 'src/mediums/**'
      - 'src/App.jsx'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - '.env.e2e'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/mediums/**'
      - 'src/App.jsx'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - '.env.e2e'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Exact-pinned to match the committed @playwright/test devDependency version — bump both
    # together (package.json and this tag) or baselines drift for no reason anyone can see in a
    # diff.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The pinned container already ships matching browsers; PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
      # keeps `npm ci`'s postinstall from re-fetching them.
      - run: npx playwright test
        env:
          CI: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
