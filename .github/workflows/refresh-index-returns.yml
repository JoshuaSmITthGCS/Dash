name: Refresh index returns

# Rebuilds public/data/index-history.json after the US close, so the Portfolio > Performance
# "Total returns" table always measures to the session that just ended.
#
# GitHub cron is UTC. Both the EDT and EST candidates are scheduled, and the gate below only
# lets a run proceed once New York time is past 16:30, so exactly the post-close one does the
# work (the other is a no-op). Fetching is idempotent, so a late or doubled run is harmless.
on:
  workflow_dispatch:
  schedule:
    - cron: '35 20 * * 1-5'  # 16:35 EDT | 15:35 EST (gated out)
    - cron: '35 21 * * 1-5'  # 17:35 EDT | 16:35 EST

permissions:
  contents: write

# Same group as refresh-advisor.yml: both commit generated JSON to main and must not race.
concurrency:
  group: scheduled-data-push-main
  cancel-in-progress: false

jobs:
  index-returns:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the market has closed
        id: window
        run: |
          now_et=$(TZ=America/New_York date +%H%M)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$((10#$now_et))" -ge 1630 ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Eastern time is $now_et, before the 16:30 post-close window; skipping."
          fi
      - uses: actions/setup-python@v5
        if: steps.window.outputs.should_run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - if: steps.window.outputs.should_run == 'true'
        run: pip install -r pipeline/requirements.txt
      - name: Build the index history
        if: steps.window.outputs.should_run == 'true'
        run: python pipeline/build_index_history.py
      - name: Commit with retry
        if: steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/index-history.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): refresh index returns after close"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
