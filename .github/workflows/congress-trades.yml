name: Collect Congressional trade disclosures

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, not daily: FMP's free tier allows 250 requests/day, but STOCK Act
    # disclosures themselves lag the trade by up to 45 days, so there's nothing to gain
    # from polling more often than that. Monday morning ET.
    - cron: '0 13 * * 1'

permissions:
  contents: write

concurrency:
  group: congress-trades-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Collect and classify Congressional trade disclosures
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python pipeline/build_congress_screen.py
      - name: Commit collected data with retry
        shell: bash
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add --all pipeline/data/congress 2>/dev/null || true
          git add public/data/screens/congress-trades.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): collect Congressional trade disclosures"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
