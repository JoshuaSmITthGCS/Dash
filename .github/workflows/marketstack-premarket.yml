name: Collect Marketstack premarket/intraday data

on:
  workflow_dispatch: {}
  schedule:
    # GitHub cron is UTC; ET is UTC-4 (EDT) or UTC-5 (EST), so each target local time is
    # fired at both UTC candidates and the Eastern-time gate below picks the real one -
    # same pattern as refresh-advisor.yml. Two runs a day, each one batched request for
    # up to 100 symbols: an after-close backfill (~16:35 ET) and a pre-open forward
    # collection (~08:05 ET), landing near 42-46 calls a month on a 100-calls/month plan.
    - cron: '35 20,21 * * 1-5'
    - cron: '5 12,13 * * 1-5'

permissions:
  contents: write

concurrency:
  group: marketstack-premarket-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select the Eastern-time collection window
        id: window
        shell: bash
        run: |
          should_run=false
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            should_run=true
          else
            local_hour="$(TZ=America/New_York date +%H)"
            case "$local_hour" in
              16|08) should_run=true ;;
            esac
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.window.outputs.should_run == 'true'
      - uses: actions/setup-python@v5
        if: steps.window.outputs.should_run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - if: steps.window.outputs.should_run == 'true'
        run: pip install -r pipeline/requirements.txt
      - name: Collect Marketstack data for the top 100 published tickers
        if: steps.window.outputs.should_run == 'true'
        env:
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
        run: python pipeline/collect_marketstack.py
      - name: Rebuild the early-session capability report
        if: steps.window.outputs.should_run == 'true'
        run: python pipeline/early_session_research.py
      - name: Re-sort Stocks (movers) and Reversal from accumulated Marketstack closes
        if: steps.window.outputs.should_run == 'true'
        run: python pipeline/resort_marketstack_screens.py
      - name: Commit collected data with retry
        if: steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "valuesignal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add --all pipeline/data/marketstack 2>/dev/null || true
          git add public/data/screens/early-session.json
          git add public/data/screens/marketstack-movers.json public/data/screens/marketstack-reversal.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): collect Marketstack premarket/intraday data"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
